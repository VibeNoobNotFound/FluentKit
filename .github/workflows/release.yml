name: Release FluentKit

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example, v0.2.6). Leave blank to create a tag."
        required: false
        type: string
      version:
        description: "New package version without the v prefix (used only when tag is blank)."
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  packages: write

env:
  PACKAGE_PROJECT: src/FluentKit/FluentKit.csproj
  SMOKE_PROJECT: samples/FluentKit.ApiSmoke/FluentKit.ApiSmoke.csproj

jobs:
  release:
    name: Validate, package, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Resolve release target
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          create_tag=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            release_tag="$GITHUB_REF_NAME"
          elif [[ -n "$REQUESTED_TAG" ]]; then
            if [[ -n "$REQUESTED_VERSION" ]]; then
              echo "Set either tag or version, not both." >&2
              exit 1
            fi
            release_tag="$REQUESTED_TAG"
            if ! git show-ref --verify --quiet "refs/tags/$release_tag"; then
              echo "Tag '$release_tag' does not exist. Choose an existing tag or leave tag blank and provide version." >&2
              exit 1
            fi
            git checkout --detach "$release_tag"
          else
            if [[ -z "$REQUESTED_VERSION" ]]; then
              echo "Provide an existing tag, or leave tag blank and provide version to create a new tag." >&2
              exit 1
            fi
            if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "Version must be a SemVer-like value such as 0.2.6 or 0.2.6-rc.1." >&2
              exit 1
            fi
            release_tag="v$REQUESTED_VERSION"
            create_tag=true
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use the form vMAJOR.MINOR.PATCH (optionally with a prerelease suffix)." >&2
            exit 1
          fi

          {
            echo "RELEASE_TAG=$release_tag"
            echo "CREATE_TAG=$create_tag"
          } >> "$GITHUB_ENV"

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(dotnet msbuild "$PACKAGE_PROJECT" -getProperty:Version -nologo)"
          tag_version="${RELEASE_TAG#v}"
          test "$package_version" = "$tag_version"

      - name: Create requested release tag
        if: env.CREATE_TAG == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag '$RELEASE_TAG' already exists remotely. Select it in the tag input instead of creating it." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release FluentKit ${RELEASE_TAG#v}"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Restore
        run: dotnet restore FluentKit.slnx

      - name: Build solution
        run: dotnet build FluentKit.slnx -c Release --no-restore -warnaserror:RS0016,RS0017

      - name: Run tests
        run: dotnet test tests/FluentKit.Tests/FluentKit.Tests.csproj -c Release --no-build --no-restore

      - name: Verify generated API reference
        run: |
          ./scripts/update-api-reference.sh Release --verify
          git diff --exit-code -- docs/reference/api.json docs/reference/api.md

      - name: Validate standalone skill
        run: python3 scripts/validate-fluentkit-api-skill.py

      - name: Package NuGet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nupkg
          dotnet pack "$PACKAGE_PROJECT" --no-restore --configuration Release --output ./nupkg
          package_path="$(find nupkg -maxdepth 1 -name '*.nupkg' -print -quit)"
          echo "PACKAGE_PATH=$package_path" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$(dotnet msbuild "$PACKAGE_PROJECT" -getProperty:PackageVersion -nologo)" >> "$GITHUB_ENV"

      - name: Verify package contract
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tools/FluentKit.ApiReferenceGenerator/FluentKit.ApiReferenceGenerator.csproj \
            -c Release --no-build --no-restore -- --verify-package "$PACKAGE_PATH" \
            --assembly "src/FluentKit/bin/Release/net10.0/FluentKit.dll" \
            --xml "src/FluentKit/bin/Release/net10.0/FluentKit.xml" \
            --manifest "docs/integration/manifest.json"

      - name: Restore and build local package smoke test
        shell: bash
        run: |
          set -euo pipefail
          feed_dir="$RUNNER_TEMP/fluentkit-feed"
          packages_dir="$RUNNER_TEMP/fluentkit-packages"
          mkdir -p "$feed_dir" "$packages_dir"
          cp "$PACKAGE_PATH" "$feed_dir/"
          echo "NUGET_PACKAGES=$packages_dir" >> "$GITHUB_ENV"
          echo "LOCAL_NUGET_FEED=$feed_dir" >> "$GITHUB_ENV"
          NUGET_PACKAGES="$packages_dir" dotnet restore "$SMOKE_PROJECT" \
            -p:FluentKitSmokeVersion="$PACKAGE_VERSION" \
            --source "$feed_dir" --source https://api.nuget.org/v3/index.json
          NUGET_PACKAGES="$packages_dir" dotnet build "$SMOKE_PROJECT" -c Release --no-restore
          NUGET_PACKAGES="$packages_dir" bash fluentkit-api/scripts/resolve-fluentkit.sh "$SMOKE_PROJECT" --property "FluentKitSmokeVersion=$PACKAGE_VERSION" --source "$feed_dir"
          manifest_path="$(NUGET_PACKAGES="$packages_dir" dotnet msbuild "$SMOKE_PROJECT" -nologo -p:FluentKitSmokeVersion="$PACKAGE_VERSION" -getProperty:FluentKitAgentManifestPath | tail -n 1 | tr -d '\r')"
          test "$(jq -r .packageVersion "$manifest_path")" = "$PACKAGE_VERSION"

          python3 scripts/test-fluentkit-contract.py \
            --root "$GITHUB_WORKSPACE" \
            --package "$PACKAGE_PATH" \
            --version "$PACKAGE_VERSION" \
            --source "$feed_dir" \
            --smoke-project "$SMOKE_PROJECT" \
            --resolver fluentkit-api/scripts/resolve-fluentkit.sh \
            --generator tools/FluentKit.ApiReferenceGenerator/FluentKit.ApiReferenceGenerator.csproj \
            --assembly src/FluentKit/bin/Release/net10.0/FluentKit.dll \
            --xml src/FluentKit/bin/Release/net10.0/FluentKit.xml \
            --manifest docs/integration/manifest.json

      - name: Create bootstrap skill release assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f fluentkit-api.zip fluentkit-api.zip.sha256
          zip -qr fluentkit-api.zip fluentkit-api
          test -s fluentkit-api.zip
          unexpected_entries="$(unzip -Z1 fluentkit-api.zip | grep -vE '^fluentkit-api(/|$)' || true)"
          if [[ -n "$unexpected_entries" ]]; then
            echo "Skill archive contains files outside fluentkit-api/." >&2
            exit 1
          fi
          sha256sum fluentkit-api.zip > fluentkit-api.zip.sha256

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source \
            --username VibeNoobNotFound \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/VibeNoobNotFound/index.json"

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source github \
            --skip-duplicate

      - name: Create GitHub Release and attach bootstrap assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" fluentkit-api.zip fluentkit-api.zip.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" fluentkit-api.zip fluentkit-api.zip.sha256 \
              --title "FluentKit ${RELEASE_TAG}" --generate-notes
          fi
