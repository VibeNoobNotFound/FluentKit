name: CI

# Runs on every commit: any branch push, and any PR targeting main.
# workflow_dispatch lets you trigger a run manually from the GitHub Actions page —
# Release publishing is tag-driven; CI validates every commit and pull request.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PACKAGE_PROJECT: src/FluentKit/FluentKit.csproj

permissions:
  contents: read

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "10.0.x"

      # against this preview SDK first.
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore FluentKit.slnx

      # Building the .slnx builds every project it references — src/FluentKit
      # (net10.0, the library), samples/FluentKit.Sample.Wasm (net10.0), and the
      # Android target of samples/Fluentkit.Sample.Maui (net11.0-android) — so this
      # single step covers "build everything" that's buildable on a Linux runner.
      - name: Build (Release)
        run: dotnet build FluentKit.slnx -c Release --no-restore -warnaserror:RS0016,RS0017

      - name: Run tests
        run: dotnet test tests/FluentKit.Tests/FluentKit.Tests.csproj -c Release --no-build --no-restore

      - name: Verify generated API reference
        shell: bash
        run: |
          dotnet run --project tools/FluentKit.ApiReferenceGenerator/FluentKit.ApiReferenceGenerator.csproj \
            -c Release --no-build -- \
            --assembly src/FluentKit/bin/Release/net10.0/FluentKit.dll \
            --xml src/FluentKit/bin/Release/net10.0/FluentKit.xml \
            --manifest docs/integration/manifest.json \
            --json docs/reference/api.json \
            --markdown docs/reference/api.md \
            --summary-baseline docs/reference/summary-baseline.json \
            --check-summaries --verify
          cmp --silent docs/reference/api.json fluentkit-api/references/api.json
          test "$(dotnet msbuild src/FluentKit/FluentKit.csproj -getProperty:Version -nologo)" = "$(jq -r .fluentkitVersion fluentkit-api/metadata.json)"

      - name: Verify generator fixture
        run: dotnet run --project tools/FluentKit.ApiReferenceGenerator/FluentKit.ApiReferenceGenerator.csproj -c Release --no-build -- --self-test

      - name: Report
        run: echo "Build, application smoke sample, generated reference, API baseline, and skill metadata verified."
