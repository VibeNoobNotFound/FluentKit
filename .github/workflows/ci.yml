name: CI

# Runs on every commit: any branch push, and any PR targeting main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  PACKAGE_PROJECT: src/FluentKit/FluentKit.csproj

permissions:
  contents: read

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore FluentKit.slnx

      # Building the .slnx builds every project it references —
      # src/FluentKit (the library) and samples/FluentKit.Sample.Wasm (the sample) —
      # so this single step covers "build everything".
      - name: Build (Release)
        run: dotnet build FluentKit.slnx -c Release --no-restore

      - name: Report
        run: echo "Build succeeded  library (src/FluentKit) + sample (FluentKit.Sample.Wasm) both compiled clean."

  # ─────────────────────────────────────────────
  # Job 2 – Pack & Publish (only on [publish-nuget])
  # ─────────────────────────────────────────────
  publish:
    name: Pack & Publish to NuGet
    runs-on: ubuntu-latest
    needs: build

    if: |
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[publish-nuget]')

    permissions:
      id-token: write   # required for NuGet Trusted Publishing (OIDC)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ${{ env.PACKAGE_PROJECT }}

      - name: Pack
        run: dotnet pack ${{ env.PACKAGE_PROJECT }} --no-restore --configuration Release --output ./nupkg

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
