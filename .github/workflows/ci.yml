name: CI

# Runs on every commit: any branch push, and any PR targeting main.
# workflow_dispatch lets you trigger a run manually from the GitHub Actions page —
# useful to force a NuGet publish without needing a new commit with [publish-nuget] in it.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PACKAGE_PROJECT: src/FluentKit/FluentKit.csproj

permissions:
  contents: read

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "10.0.x"

      # against this preview SDK first.
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore FluentKit.slnx

      # Building the .slnx builds every project it references — src/FluentKit
      # (net10.0, the library), samples/FluentKit.Sample.Wasm (net10.0), and the
      # Android target of samples/Fluentkit.Sample.Maui (net11.0-android) — so this
      # single step covers "build everything" that's buildable on a Linux runner.
      - name: Build (Release)
        run: dotnet build FluentKit.slnx -c Release --no-restore

      - name: Report
        run: echo "Build succeeded — library (src/FluentKit) + samples (Wasm, Maui/Android) all compiled clean."

  # ─────────────────────────────────────────────
  # Job 2 – Pack & Publish (on [publish-nuget] commits, or manual dispatch)
  # ─────────────────────────────────────────────
  publish:
    name: Pack & Publish to NuGet
    runs-on: ubuntu-latest
    needs: build

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, '[publish-nuget]'))

    permissions:
      id-token: write   # required for NuGet Trusted Publishing (OIDC)
      contents: read
      packages: write   # required to push to GitHub Packages (NuGet registry)

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ${{ env.PACKAGE_PROJECT }}

      - name: Pack
        run: dotnet pack ${{ env.PACKAGE_PROJECT }} --no-restore --configuration Release --output ./nupkg

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # Separate push to GitHub Packages so the package also shows under
      # https://github.com/VibeNoobNotFound/FluentKit/pkgs — uses the built-in
      # GITHUB_TOKEN, no extra secret needed. Requires RepositoryUrl in the
      # .csproj to point at this repo (already set) so GitHub links it correctly.
      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source \
            --username VibeNoobNotFound \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/VibeNoobNotFound/index.json"

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source github \
            --skip-duplicate