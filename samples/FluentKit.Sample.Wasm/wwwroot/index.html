<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FluentKit Gallery</title>
    <meta name="description" content="Interactive gallery showcasing FluentKit components — a WinUI-style Blazor component library." />
    <base href="/" />
    <link rel="stylesheet" href="_content/FluentKit/Tokens/tokens.css" />
    <link rel="stylesheet" href="_content/FluentKit/Icons/FluentSystemIcons-Regular.css" />
    <link href="FluentKit.Sample.Wasm.styles.css" rel="stylesheet" />
    <!-- Prism.js syntax highlighting (MIT) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
    <!-- Gallery layout styles -->
    <link rel="stylesheet" href="_content/FluentKit.Sample.Shared/gallery.css" />
</head>
<body>
    <div id="app">Loading…</div>

    <!-- Prism.js: core + autoloader fetches grammars on demand -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script>
        window.galleryHighlight = function (elementId) {
            var el = document.getElementById(elementId);
            if (el && window.Prism) { Prism.highlightElement(el); }
        };
        window.galleryHighlightAll = function () {
            if (window.Prism) Prism.highlightAll();
        };
        window.galleryScrollTop = function () {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Live editor: transparent <textarea> stacked on top of a real <pre><code>.
        // On every keystroke we push the raw text into the <code> element (as
        // textContent, so it's safely escaped) and re-run Prism on just that
        // element — cheap enough to do per-keystroke for the snippet sizes this
        // editor is meant for.
        window.liveHighlight = function (codeElementId, code) {
            var el = document.getElementById(codeElementId);
            if (!el || !window.Prism) return;
            el.textContent = code;
            Prism.highlightElement(el);
        };

        // Keeps the highlighted <pre> scrolled to match the (invisible-text)
        // <textarea> on top of it, since the textarea is what actually receives
        // scroll/wheel/keyboard-driven scroll. Attaches its listener once per
        // textarea (guarded via a dataset flag) since Blazor re-renders don't
        // recreate the DOM node here (same element, value patched in place).
        window.liveHighlightSyncScroll = function (textareaId, preId) {
            var ta = document.getElementById(textareaId);
            var pre = document.getElementById(preId);
            if (!ta || !pre || ta.dataset.liveSyncAttached) return;
            ta.dataset.liveSyncAttached = "1";
            ta.addEventListener('scroll', function () {
                pre.scrollTop = ta.scrollTop;
                pre.scrollLeft = ta.scrollLeft;
            });
        };

        // Thin wrappers around localStorage for persisting gallery settings
        // (theme mode, Mica variant, custom wallpaper). Failures (private
        // browsing, quota exceeded, storage disabled) are swallowed here so
        // callers just see a null/no-op instead of a thrown JSException.
        window.galleryStorageGet = function (key) {
            try { return window.localStorage.getItem(key); }
            catch (e) { return null; }
        };
        window.galleryStorageSet = function (key, value) {
            try { window.localStorage.setItem(key, value); return true; }
            catch (e) { return false; }
        };
        window.galleryStorageRemove = function (key) {
            try { window.localStorage.removeItem(key); }
            catch (e) { /* ignore */ }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
